<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>ALIBAFILM - Administration</title>
  <style>
    body { background: #0b0f19; color: white; font-family: sans-serif; padding: 40px; }
    .box { background: #151c2e; padding: 25px; border-radius: 12px; max-width: 600px; margin: 0 auto 30px auto; border: 1px solid #252e48; }
    h2 { margin-bottom: 20px; color: #ff2a5f; }
    input, select, button { width: 100%; padding: 12px; margin-bottom: 15px; border-radius: 6px; border: 1px solid #252e48; background: #0b0f19; color: white; }
    button { background: #ff2a5f; color: white; font-weight: bold; border: none; cursor: pointer; }
  </style>
</head>
<body>

  <div class="box">
    <h2>Authentification Admin</h2>
    <input type="password" id="adminPass" placeholder="Mot de passe admin (admba)">
  </div>

  <div class="box">
    <h2>Ajouter un Film / Série</h2>
    <input type="text" id="title" placeholder="Titre du film">
    <input type="text" id="category" placeholder="Catégorie (Action, Sci-Fi...)">
    <input type="text" id="videoUrl" placeholder="URL de la vidéo (.mp4)">
    <input type="text" id="poster" placeholder="URL de l'image de couverture">
    
    <label>Accès :</label>
    <select id="isPremium">
      <option value="true">ALIBAPREMIUM Uniquement</option>
      <option value="false">Gratuit</option>
    </select>

    <label>Durée de l'extrait gratuit (en secondes) :</label>
    <input type="number" id="previewSeconds" value="60">

    <button onclick="addMovie()">Ajouter au catalogue</button>
  </div>

  <div class="box">
    <h2>Gérer l'Abonnement d'un Utilisateur</h2>
    <input type="email" id="userEmail" placeholder="Email de l'utilisateur">
    <select id="userPremiumStatus">
      <option value="true">Offrir l'abonnement</option>
      <option value="false">Révoquer l'abonnement</option>
    </select>
    <input type="number" id="subDays" placeholder="Nombre de jours d'abonnement" value="30">
    <button onclick="updateUser()">Mettre à jour l'utilisateur</button>
  </div>

  <script>
    async function addMovie() {
      const password = document.getElementById('adminPass').value;
      const data = {
        password,
        title: document.getElementById('title').value,
        category: document.getElementById('category').value,
        videoUrl: document.getElementById('videoUrl').value,
        poster: document.getElementById('poster').value,
        isPremium: document.getElementById('isPremium').value === 'true',
        previewSeconds: document.getElementById('previewSeconds').value
      };

      const res = await fetch('/api/admin/add-movie', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(data)
      });
      const result = await res.json();
      if(result.success) alert("Film ajouté avec succès !");
      else alert(result.error || "Erreur lors de l'ajout");
    }

    async function updateUser() {
      const password = document.getElementById('adminPass').value;
      const data = {
        password,
        email: document.getElementById('userEmail').value,
        isPremium: document.getElementById('userPremiumStatus').value === 'true',
        days: document.getElementById('subDays').value
      };

      const res = await fetch('/api/admin/user-subscription', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(data)
      });
      const result = await res.json();
      if(result.success) alert("Abonnement mis à jour !");
      else alert(result.error || "Erreur");
    }
  </script>
</body>
</html>
