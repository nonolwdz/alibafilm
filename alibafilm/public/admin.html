<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>ALIBAFILM - Panneau d'Administration</title>
  <style>
    body { background: #09090f; color: white; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; padding: 40px; }
    h1 { text-align: center; margin-bottom: 40px; background: linear-gradient(135deg, #ff0055, #9d00ff); -webkit-background-clip: text; color: transparent; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 30px; max-width: 1000px; margin: 0 auto; }
    .card { background: #161622; padding: 30px; border-radius: 15px; border: 1px solid #333; }
    .full-width { grid-column: 1 / -1; }
    h2 { margin-bottom: 20px; font-size: 20px; }
    
    input, select, button { width: 100%; padding: 12px; margin-bottom: 15px; border-radius: 8px; border: 1px solid #333; background: #09090f; color: white; outline: none; box-sizing: border-box; }
    input[type="file"] { background: #222233; cursor: pointer; border-color: #ff0055; }
    input:focus, select:focus { border-color: #ff0055; }
    button { background: linear-gradient(135deg, #ff0055, #9d00ff); border: none; font-weight: bold; cursor: pointer; transition: 0.2s; }
    button:hover { opacity: 0.9; transform: translateY(-2px); }
    label { display: block; margin-bottom: 5px; font-size: 12px; color: #aaa; }
    #progressText { display: none; color: #00ff88; font-weight: bold; margin-bottom: 15px; text-align: center; }

    .movie-item { background: #09090f; padding: 15px; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; border: 1px solid #333; margin-bottom: 10px;}
    .movie-info { display: flex; flex-direction: column; gap: 5px; }
    .movie-actions { display: flex; gap: 10px; }
    .movie-actions button { width: auto; margin-bottom: 0; padding: 8px 15px; font-size: 12px; }
    .btn-edit { background: transparent; border: 1px solid #00ff88; color: #00ff88; }
    .btn-delete { background: transparent; border: 1px solid #ff0055; color: #ff0055; }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

  <h1>Contrôle Principal - ALIBAFILM</h1>

  <div style="max-width: 400px; margin: 0 auto 30px auto;">
    <input type="password" id="adminPass" placeholder="Mot de passe Administrateur (admba)" style="border-color: #ff0055;">
  </div>

  <div class="grid">
    <div class="card" id="formCard">
      <h2 id="formTitle">Ajouter un Film / Série</h2>
      <input type="text" id="title" placeholder="Titre (ex: HPI Saison 5)">
      <input type="text" id="category" placeholder="Catégorie (ex: Série)">
      
      <label style="color: #ff0055; font-weight: bold;">Lien direct de la Vidéo (Recommandé pour les gros fichiers) :</label>
      <input type="url" id="manualVideoUrl" placeholder="Colle ici le lien public Supabase de ta vidéo">

      <label style="color: #aaa; font-size: 11px; margin-top: -10px; margin-bottom: 15px;">OU Fichier Vidéo (uniquement pour les petits fichiers) :</label>
      <input type="file" id="videoFile" accept="video/*">
      
      <input type="url" id="poster" placeholder="Lien de l'image de couverture (Affiche)">
      
      <label>Statut de l'abonnement :</label>
      <select id="isPremium" onchange="togglePreviewField()">
        <option value="true">Payant (ALIBAPREMIUM requis)</option>
        <option value="false">100% Gratuit</option>
      </select>

      <div id="previewContainer">
        <label>Durée de l'extrait gratuit (en secondes) :</label>
        <input type="number" id="previewSeconds" placeholder="Ex: 60" value="60">
      </div>

      <div id="progressText">Upload en cours...</div>

      <div style="display: flex; gap: 10px;">
        <button id="uploadBtn">Publier le Film / Série</button>
        <button id="cancelEditBtn" onclick="cancelEdit()" style="display: none; background: transparent; border: 1px solid #aaa; color: #aaa;">Annuler</button>
      </div>
    </div>

    <div class="card">
      <h2>Gérer les abonnements Utilisateurs</h2>
      <input type="email" id="userEmail" placeholder="Email du compte utilisateur">
      <select id="grantAction">
        <option value="true">Offrir des jours Premium</option>
        <option value="false">Révoquer / Enlever le Premium</option>
      </select>
      <input type="number" id="days" placeholder="Ex: 30" value="30">
      <button id="userBtn">Appliquer à l'utilisateur</button>
    </div>

    <div class="card full-width">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
        <h2 style="margin: 0;">Catalogue Actuel</h2>
        <button onclick="loadMovies()" style="width: auto; padding: 8px 15px; margin: 0;">Rafraîchir</button>
      </div>
      <div id="movieList"></div>
    </div>
  </div>

  <script>
    const supabaseUrl = 'https://onvmmrgnzbargubpkqxk.supabase.co';
    const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9udm1tcmduemJhcmd1YnBrcXhrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUzMjMwODUsImV4cCI6MjEwMDg5OTA4NX0.LzFuewqBW0mvGy98DfsWOr5eYFuqI-kNrD0foFy2Nhg';
    const client = window.supabase.createClient(supabaseUrl, supabaseKey);

    let currentMovies = [];
    let editingId = null;
    let editingVideoUrl = null;

    function togglePreviewField() {
      const isPremium = document.getElementById('isPremium').value === 'true';
      document.getElementById('previewContainer').style.display = isPremium ? 'block' : 'none';
    }

    async function loadMovies() {
      const res = await fetch('/api/movies');
      currentMovies = await res.json();
      
      const list = document.getElementById('movieList');
      if(currentMovies.length === 0) {
        list.innerHTML = "<p style='color:#aaa;'>Aucun film en ligne pour le moment.</p>";
        return;
      }
      
      list.innerHTML = currentMovies.map(m => `
        <div class="movie-item">
            <div class="movie-info">
                <strong style="font-size: 18px;">${m.title}</strong>
                <span style="font-size: 12px; color: #aaa;">${m.category} | ${m.isPremium ? `💎 PREMIUM (${m.previewSeconds}s)` : '🟢 GRATUIT'}</span>
            </div>
            <div class="movie-actions">
                <button class="btn-edit" onclick="prepareEdit('${m.id}')">Modifier</button>
                <button class="btn-delete" onclick="deleteMovie('${m.id}')">Supprimer</button>
            </div>
        </div>
      `).join('');
    }

    function prepareEdit(id) {
      const m = currentMovies.find(x => x.id === id);
      if(!m) return;
      
      editingId = id;
      editingVideoUrl = m.videoUrl; 
      
      document.getElementById('title').value = m.title;
      document.getElementById('category').value = m.category;
      document.getElementById('poster').value = m.poster;
      document.getElementById('manualVideoUrl').value = m.videoUrl;
      document.getElementById('isPremium').value = m.isPremium.toString();
      document.getElementById('previewSeconds').value = m.previewSeconds;
      
      togglePreviewField();
      document.getElementById('formTitle').innerText = "✏️ Modifier : " + m.title;
      document.getElementById('uploadBtn').innerText = "Enregistrer les modifications";
      document.getElementById('cancelEditBtn').style.display = "block";
      window.scrollTo(0, 0); 
    }

    function cancelEdit() {
      editingId = null;
      editingVideoUrl = null;
      document.getElementById('title').value = '';
      document.getElementById('category').value = '';
      document.getElementById('poster').value = '';
      document.getElementById('manualVideoUrl').value = '';
      document.getElementById('videoFile').value = '';
      document.getElementById('isPremium').value = 'true';
      togglePreviewField();
      
      document.getElementById('formTitle').innerText = "Ajouter un Film / Série";
      document.getElementById('uploadBtn').innerText = "Publier le Film / Série";
      document.getElementById('cancelEditBtn').style.display = "none";
    }

    document.getElementById('uploadBtn').addEventListener('click', async () => {
      const password = document.getElementById('adminPass').value;
      if (!password) return alert("Saisis le mot de passe admin en haut !");

      const manualUrl = document.getElementById('manualVideoUrl').value.trim();
      const fileInput = document.getElementById('videoFile');
      const file = fileInput.files[0];

      let finalVideoUrl = manualUrl || editingVideoUrl;

      const btn = document.getElementById('uploadBtn');
      const progressText = document.getElementById('progressText');
      btn.disabled = true;
      btn.style.opacity = "0.5";

      try {
        // Si aucun lien direct n'est collé mais qu'un fichier est choisi (petits fichiers)
        if (!finalVideoUrl && file) {
          progressText.style.display = "block";
          const fileName = Date.now() + '-' + file.name.replace(/\s+/g, '-');
          const { data, error } = await client.storage.from('movies').upload(fileName, file);
          if (error) throw error;
          const { data: publicUrlData } = client.storage.from('movies').getPublicUrl(fileName);
          finalVideoUrl = publicUrlData.publicUrl;
        }

        if (!finalVideoUrl) {
          alert("Veuillez coller un lien vidéo ou sélectionner un fichier !");
          btn.disabled = false;
          btn.style.opacity = "1";
          progressText.style.display = "none";
          return;
        }

        const isPrem = document.getElementById('isPremium').value === 'true';
        const endpoint = editingId ? `/api/admin/movies/${editingId}` : '/api/admin/movies';
        const method = editingId ? 'PUT' : 'POST';

        const res = await fetch(endpoint, {
          method: method,
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            password: password,
            title: document.getElementById('title').value,
            category: document.getElementById('category').value,
            poster: document.getElementById('poster').value,
            isPremium: isPrem,
            previewSeconds: isPrem ? document.getElementById('previewSeconds').value : 0,
            videoUrl: finalVideoUrl
          })
        });

        const result = await res.json();
        if(result.success) {
          alert(editingId ? "Modifications enregistrées !" : "Film ajouté avec succès !");
          cancelEdit();
          loadMovies(); 
        } else {
          alert("Erreur Serveur : " + result.error);
        }
      } catch (err) {
        alert("Erreur : " + err.message);
      } finally {
        btn.disabled = false;
        btn.style.opacity = "1";
        progressText.style.display = "none";
      }
    });

    async function deleteMovie(id) {
      const password = document.getElementById('adminPass').value;
      if (!password) return alert("Saisis le mot de passe admin en haut !");
      if(!confirm("⚠️ Es-tu sûr de vouloir supprimer ce film de la liste ?")) return;

      const res = await fetch(`/api/admin/movies/${id}`, {
        method: 'DELETE',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ password })
      });
      const result = await res.json();
      if(result.success) loadMovies();
      else alert("Erreur : " + result.error);
    }

    loadMovies();

    document.getElementById('userBtn').addEventListener('click', async () => {
      const password = document.getElementById('adminPass').value;
      if (!password) return alert("Saisis le mot de passe admin en haut !");
      
      const res = await fetch('/api/admin/users', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          password, email: document.getElementById('userEmail').value,
          grantPremium: document.getElementById('grantAction').value === 'true',
          days: document.getElementById('days').value
        })
      });
      const result = await res.json();
      if(result.success) alert("Opération réussie !"); else alert("Erreur : " + result.error);
    });
  </script>
</body>
</html>
