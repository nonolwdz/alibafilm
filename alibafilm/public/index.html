<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ALIBAFILM - Streaming</title>
  <style>
    :root {
      --bg: #09090f;
      --card-bg: #161622;
      --primary: #ff0055;
      --secondary: #9d00ff;
      --text: #ffffff;
      --text-muted: #aaaaaa;
    }

    body { margin: 0; background: var(--bg); color: var(--text); font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; overflow-x: hidden; }
    
    header { 
      display: flex; justify-content: space-between; align-items: center; padding: 20px 40px; 
      background: rgba(9, 9, 15, 0.85); backdrop-filter: blur(10px);
      position: sticky; top: 0; z-index: 100; border-bottom: 1px solid rgba(255,255,255,0.05);
    }
    h1 { margin: 0; background: linear-gradient(135deg, var(--primary), var(--secondary)); -webkit-background-clip: text; color: transparent; font-size: 28px; letter-spacing: 1px; }
    
    .search-bar { flex-grow: 1; max-width: 400px; margin: 0 40px; position: relative; }
    .search-bar input { 
      width: 100%; padding: 12px 20px; border-radius: 20px; border: 1px solid #333; 
      background: rgba(22, 22, 34, 0.6); color: white; outline: none; font-size: 14px; transition: 0.3s;
    }
    .search-bar input:focus { border-color: var(--primary); background: var(--card-bg); box-shadow: 0 0 15px rgba(255, 0, 85, 0.2); }
    
    button { transition: 0.2s; cursor: pointer; outline: none; }
    nav { display: flex; align-items: center; }
    nav button { background: rgba(255, 255, 255, 0.1); color: white; border: 1px solid rgba(255, 255, 255, 0.1); padding: 10px 20px; border-radius: 30px; margin-left: 10px; font-weight: 500; }
    nav button:hover { background: rgba(255, 255, 255, 0.2); transform: translateY(-1px); }
    nav button.premium-btn { background: linear-gradient(135deg, var(--primary), var(--secondary)); font-weight: bold; box-shadow: 0 4px 15px rgba(157, 0, 255, 0.3); border: none; }
    
    .btn-primary { background: linear-gradient(135deg, var(--primary), var(--secondary)); color: white; border-radius: 50px; font-weight: bold; text-transform: uppercase; font-size: 14px; letter-spacing: 1px; box-shadow: 0 4px 15px rgba(255, 0, 85, 0.4); border: none; }
    .btn-primary:hover { opacity: 0.9; transform: scale(1.02); box-shadow: 0 6px 20px rgba(255, 0, 85, 0.6); }
    .btn-secondary { background: rgba(255, 255, 255, 0.1); color: white; border: 1px solid rgba(255, 255, 255, 0.2); border-radius: 50px; backdrop-filter: blur(5px); }
    .btn-secondary:hover { background: rgba(255, 255, 255, 0.2); }
    .btn-ghost { background: transparent; color: var(--text-muted); text-decoration: underline; border: none; font-size: 14px; margin-top: 15px; }
    .btn-ghost:hover { color: white; }

    .container { padding: 40px; }
    h2 { font-size: 22px; font-weight: 600; margin-bottom: 20px; border-left: 4px solid var(--primary); padding-left: 10px; }

    .hero { 
      position: relative; height: 60vh; border-radius: 15px; margin-bottom: 50px; overflow: hidden;
      background-size: cover; background-position: center; 
      display: flex; align-items: flex-end; padding: 40px; 
      box-shadow: inset 0 -200px 150px -50px var(--bg);
    }
    .hero::before { content: ""; position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: linear-gradient(to right, rgba(9,9,15,0.9) 0%, rgba(9,9,15,0) 60%); pointer-events: none; }
    .hero-content { position: relative; z-index: 10; max-width: 600px; }
    .hero-title { font-size: 48px; font-weight: 800; margin-bottom: 10px; text-transform: uppercase; }
    .hero-meta { display: flex; gap: 15px; margin-bottom: 20px; font-size: 14px; color: var(--text-muted); align-items: center; }
    .hero-btn { background: white; color: black; border: none; padding: 12px 30px; font-size: 16px; font-weight: bold; border-radius: 30px; display: flex; align-items: center; gap: 10px; }
    .hero-btn:hover { background: #ddd; transform: scale(1.05); }

    .slider { display: flex; gap: 20px; overflow-x: auto; padding-bottom: 20px; scroll-snap-type: x mandatory; scrollbar-width: none; }
    .slider::-webkit-scrollbar { display: none; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 20px; }
    
    .movie-card { background: var(--card-bg); border-radius: 10px; overflow: hidden; cursor: pointer; transition: 0.3s; border: 1px solid rgba(255,255,255,0.05); position: relative; }
    .slider .movie-card { min-width: 220px; flex: 0 0 auto; scroll-snap-align: start; }
    .movie-card:hover { transform: translateY(-10px) scale(1.02); border-color: var(--primary); box-shadow: 0 10px 20px rgba(0,0,0,0.5); z-index: 2; }
    .movie-card img { width: 100%; height: 320px; object-fit: cover; transition: 0.3s; }
    .movie-card:hover img { opacity: 0.8; }
    .movie-info { padding: 15px; background: linear-gradient(to top, var(--card-bg) 80%, transparent); position: absolute; bottom: 0; width: 100%; box-sizing: border-box; }
    .movie-title { font-weight: bold; margin-bottom: 5px; font-size: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-shadow: 1px 1px 3px black;}
    .badge { display: inline-block; padding: 4px 8px; border-radius: 4px; font-size: 10px; font-weight: bold; text-transform: uppercase; }
    .badge.premium { background: var(--primary); }
    .badge.free { background: #00ff88; color: black; }

    .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); justify-content: center; align-items: center; z-index: 1000; backdrop-filter: blur(5px); }
    .modal-content { background: var(--card-bg); padding: 40px; border-radius: 20px; border: 1px solid #333; width: 90%; max-width: 400px; text-align: center; box-shadow: 0 20px 50px rgba(0,0,0,0.5); position: relative; }
    .modal-content input { width: 100%; padding: 15px; margin-bottom: 15px; border-radius: 10px; border: 1px solid #333; background: var(--bg); color: white; outline: none; box-sizing: border-box; }
    .modal-content input:focus { border-color: var(--primary); }
    .modal-content button { width: 100%; padding: 15px; margin-bottom: 10px; font-size: 16px; }
    .close-btn { background: transparent; color: white; border: none; position: absolute; top: 15px; right: 20px; font-size: 28px; width: auto; padding: 0; }

    #videoContainer { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: black; z-index: 2000; flex-direction: column; }
    video { width: 100%; height: 100%; background: black; }
    .video-header { position: absolute; top: 0; left: 0; width: 100%; padding: 20px 40px; background: linear-gradient(to bottom, rgba(0,0,0,0.9), transparent); display: flex; justify-content: space-between; align-items: center; z-index: 2002; box-sizing: border-box; }
    #paywall { display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: var(--bg); justify-content: center; align-items: center; flex-direction: column; z-index: 2005; text-align: center; }
  </style>
</head>
<body>

  <header>
    <h1>ALIBAFILM</h1>
    
    <div class="search-bar">
      <input type="text" id="searchInput" placeholder="Rechercher un film, une série, un genre..." oninput="handleSearch()">
    </div>

    <nav id="navAuth">
      <button onclick="showModal('authModal')">Connexion</button>
    </nav>
    <nav id="navUser" style="display: none;">
      <span id="userStatus" style="margin-right: 15px; font-weight: bold;"></span>
      <div id="actionBtnContainer"></div>
      <button onclick="logout()">Déconnexion</button>
    </nav>
  </header>

  <main id="mainContent" class="container">
    <div id="heroSection"></div>
    <h2>Derniers ajouts</h2>
    <div class="slider" id="latestMoviesGrid"></div>
    <h2 style="margin-top: 50px;">Tout le catalogue</h2>
    <div class="grid" id="allMoviesGrid"></div>
  </main>

  <main id="searchContent" class="container" style="display: none;">
    <h2>Résultats de la recherche</h2>
    <div class="grid" id="searchResultsGrid"></div>
  </main>

  <div class="modal" id="authModal">
    <div class="modal-content">
      <button class="close-btn" onclick="hideModal('authModal')">×</button>
      <h2 style="margin-top: 0; margin-bottom: 25px; border:none; padding:0;">Mon Compte</h2>
      <input type="email" id="email" placeholder="Adresse Email">
      <input type="password" id="password" placeholder="Mot de passe">
      <button class="btn-primary" onclick="login()">Se connecter</button>
      <button class="btn-secondary" onclick="register()">Créer un compte</button>
    </div>
  </div>

  <div class="modal" id="manageSubModal">
    <div class="modal-content">
      <button class="close-btn" onclick="hideModal('manageSubModal')">×</button>
      <h2 style="margin-top: 0; margin-bottom: 25px; border:none; padding:0;">Mon Abonnement</h2>
      <div id="subDetails" style="margin-bottom: 20px; font-size: 16px; color: #ddd; line-height: 1.5;"></div>
      <button class="btn-primary" onclick="hideModal('manageSubModal')">Fermer</button>
      <button class="btn-ghost" onclick="cancelSubscription()">Résilier mon abonnement</button>
    </div>
  </div>

  <div id="videoContainer">
    <div class="video-header">
      <h2 id="videoTitle" style="margin: 0; border: none; padding: 0; text-shadow: 0 2px 4px rgba(0,0,0,0.8);"></h2>
      <button class="btn-secondary" style="width: auto; margin: 0; padding: 8px 20px;" onclick="closeVideo()">Retour</button>
    </div>
    
    <div style="position: relative; height: 100%; width: 100%; display: flex; justify-content: center; align-items: center;">
      <video id="videoPlayer" controls controlsList="nodownload"></video>
      <div id="paywall">
        <h2 style="font-size: 32px; color: var(--primary); border:none; margin-bottom: 10px;">⏱️ Fin de l'extrait gratuit</h2>
        <p style="font-size: 18px; margin-bottom: 30px; color: #ddd;">Passe au statut Premium pour débloquer la suite !</p>
        <button class="btn-primary" style="width: auto; padding: 15px 40px;" onclick="subscribe()">Devenir ALIBAPREMIUM (3.99€)</button>
        <button class="btn-ghost" onclick="closeVideo()">Non merci, retourner au catalogue</button>
      </div>
    </div>
  </div>

  <script>
    let currentUser = null;
    let movies = [];
    const videoPlayer = document.getElementById('videoPlayer');
    let currentMovie = null;
    let isPreviewEnded = false;

    // --- VÉRIFICATION DU PROFIL À CHAQUE CHARGEMENT ---
    async function checkUserSession() {
      const savedUser = localStorage.getItem('alibafilm_user');
      if (!savedUser) return;

      currentUser = JSON.parse(savedUser);
      updateUI(); // Affichage immédiat avec les données en mémoire

      try {
        // Interroge le serveur en arrière-plan pour voir si le statut a changé (ex: admin qui offre le premium)
        const res = await fetch('/api/auth/verify', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email: currentUser.email })
        });
        const data = await res.json();
        
        if (data.success) {
          currentUser = data.user;
          localStorage.setItem('alibafilm_user', JSON.stringify(currentUser));
          updateUI(); // Met à jour l'affichage instantanément
        } else {
          logout();
        }
      } catch (e) {
        console.log("Vérification silencieuse impossible (hors ligne)");
      }
    }

    function subscribe() {
      if (!currentUser) {
        alert("Tu dois d'abord te connecter ou créer un compte !");
        showModal('authModal');
        return;
      }
      window.location.href = "https://buy.stripe.com/14A5kC1SheK6ctc5MqgQE00"; 
    }

    async function loadMovies() {
      try {
        const res = await fetch('/api/movies');
        const data = await res.json();
        movies = data.reverse(); 
        renderUI();
      } catch (err) {
        document.getElementById('mainContent').innerHTML = "<p>Erreur de connexion.</p>";
      }
    }

    function getMovieCardHTML(m) {
      return `
        <div class="movie-card" onclick="openVideo('${m.id}')">
          <img src="${m.poster || 'https://via.placeholder.com/300x450/222233/ffffff?text=Image+Manquante'}" alt="${m.title}">
          <div class="movie-info">
            <div class="movie-title">${m.title}</div>
            <div style="display:flex; justify-content:space-between; align-items:center;">
              <span class="badge ${m.isPremium ? 'premium' : 'free'}">${m.isPremium ? '💎 PREMIUM' : '🟢 GRATUIT'}</span>
            </div>
          </div>
        </div>
      `;
    }

    function renderUI() {
      if (movies.length === 0) return;
      const featured = movies[0];
      document.getElementById('heroSection').innerHTML = `
        <div class="hero" style="background-image: url('${featured.poster || 'https://via.placeholder.com/1200x600/161622/ffffff?text=Image+Manquante'}');">
          <div class="hero-content">
            <span class="badge ${featured.isPremium ? 'premium' : 'free'}" style="margin-bottom:10px;">${featured.isPremium ? '💎 PREMIUM' : '🟢 NOUVEAUTÉ GRATUITE'}</span>
            <div class="hero-title">${featured.title}</div>
            <div class="hero-meta">
              <span>Catégorie : ${featured.category}</span>
              <span>Extrait : ${featured.previewSeconds} sec</span>
            </div>
            <button class="hero-btn" onclick="openVideo('${featured.id}')">▶ Regarder maintenant</button>
          </div>
        </div>
      `;

      const latest = movies.slice(0, 6);
      document.getElementById('latestMoviesGrid').innerHTML = latest.map(getMovieCardHTML).join('');
      document.getElementById('allMoviesGrid').innerHTML = movies.map(getMovieCardHTML).join('');
    }

    function handleSearch() {
      const query = document.getElementById('searchInput').value.toLowerCase();
      const mainContent = document.getElementById('mainContent');
      const searchContent = document.getElementById('searchContent');
      const searchResultsGrid = document.getElementById('searchResultsGrid');

      if (query.trim() === "") {
        mainContent.style.display = 'block';
        searchContent.style.display = 'none';
        return;
      }

      const filtered = movies.filter(m => m.title.toLowerCase().includes(query) || m.category.toLowerCase().includes(query));
      mainContent.style.display = 'none';
      searchContent.style.display = 'block';

      if (filtered.length > 0) {
        searchResultsGrid.innerHTML = filtered.map(getMovieCardHTML).join('');
      } else {
        searchResultsGrid.innerHTML = `<p style="color:#aaa;">Aucun résultat pour "${query}".</p>`;
      }
    }

    function openVideo(id) {
      currentMovie = movies.find(m => m.id === id);
      if (!currentMovie) return;

      isPreviewEnded = false;
      document.getElementById('videoTitle').innerText = currentMovie.title;
      videoPlayer.src = currentMovie.videoUrl;
      videoPlayer.style.display = 'block'; 
      document.getElementById('videoContainer').style.display = 'flex';
      document.getElementById('paywall').style.display = 'none';
      videoPlayer.setAttribute('controls', 'controls');
      videoPlayer.play().catch(e => console.log("Play bloqué."));
    }

    function closeVideo() {
      videoPlayer.pause();
      videoPlayer.src = "";
      document.getElementById('videoContainer').style.display = 'none';
      document.getElementById('paywall').style.display = 'none';
      currentMovie = null;
    }

    videoPlayer.addEventListener('timeupdate', () => {
      if (!currentMovie) return;
      if (currentMovie.isPremium && (!currentUser || !currentUser.isPremium)) {
        if (videoPlayer.currentTime >= currentMovie.previewSeconds) {
          triggerPaywall();
        }
      }
    });

    videoPlayer.addEventListener('play', () => {
      if (isPreviewEnded) videoPlayer.pause();
    });

    function triggerPaywall() {
      if (isPreviewEnded) return;
      isPreviewEnded = true;
      videoPlayer.pause();

      if (document.fullscreenElement) { document.exitFullscreen(); }
      else if (document.webkitFullscreenElement) { document.webkitExitFullscreen(); }
      else if (document.mozFullScreenElement) { document.mozCancelFullScreen(); }
      else if (document.msFullscreenElement) { document.msExitFullscreen(); }
      if (videoPlayer.webkitDisplayingFullscreen) { videoPlayer.webkitExitFullscreen(); }

      videoPlayer.style.display = 'none';
      document.getElementById('paywall').style.display = 'flex';
    }

    async function register() {
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      if(!email || !password) return alert("Remplis tous les champs !");

      const res = await fetch('/api/auth/register', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, password })
      });
      const data = await res.json();
      if(data.success) {
        currentUser = data.user;
        localStorage.setItem('alibafilm_user', JSON.stringify(currentUser));
        updateUI();
        hideModal('authModal');
        alert("Compte créé avec succès ! Bienvenue !");
      } else { alert(data.error); }
    }

    async function login() {
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      if(!email || !password) return alert("Remplis tous les champs !");

      const res = await fetch('/api/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, password })
      });
      const data = await res.json();
      if(data.success) {
        currentUser = data.user;
        localStorage.setItem('alibafilm_user', JSON.stringify(currentUser));
        updateUI();
        hideModal('authModal');
      } else { alert(data.error); }
    }

    function logout() {
      currentUser = null;
      localStorage.removeItem('alibafilm_user');
      updateUI();
    }

    function updateUI() {
      if (currentUser) {
        document.getElementById('navAuth').style.display = 'none';
        document.getElementById('navUser').style.display = 'flex';
        
        const status = document.getElementById('userStatus');
        const actionBtnContainer = document.getElementById('actionBtnContainer');

        if (currentUser.isPremium) {
          status.innerHTML = `👤 ${currentUser.email} <span style="color: #00ff88;">(💎 PREMIUM)</span>`;
          actionBtnContainer.innerHTML = `<button onclick="openManageSub()">Gérer l'abonnement</button>`;
        } else {
          status.innerHTML = `👤 ${currentUser.email} <span style="color: #aaa;">(Gratuit)</span>`;
          actionBtnContainer.innerHTML = `<button class="premium-btn" onclick="subscribe()">Devenir ALIBAPREMIUM</button>`;
        }
      } else {
        document.getElementById('navAuth').style.display = 'block';
        document.getElementById('navUser').style.display = 'none';
      }
    }

    function openManageSub() {
      const subDetails = document.getElementById('subDetails');
      if (currentUser.premiumUntil) {
        const dateObj = new Date(currentUser.premiumUntil);
        const dateStr = dateObj.toLocaleDateString('fr-FR');
        subDetails.innerHTML = `
          <p><strong style="color: #00ff88;">✓ Statut :</strong> Actif</p>
          <p><strong>Origine :</strong> Offert par un Administrateur 🎁</p>
          <p><strong>Valable jusqu'au :</strong> ${dateStr}</p>
        `;
      } else {
        subDetails.innerHTML = `
          <p><strong style="color: #00ff88;">✓ Statut :</strong> Actif</p>
          <p><strong>Origine :</strong> Abonnement Standard</p>
          <p>Renouvellement automatique activé.</p>
        `;
      }
      showModal('manageSubModal');
    }

    function cancelSubscription() {
      alert("Pour des raisons de sécurité, la résiliation doit s'effectuer depuis votre compte Stripe ou en contactant l'administrateur ALIBAFILM.");
    }

    function showModal(id) { document.getElementById(id).style.display = 'flex'; }
    function hideModal(id) { document.getElementById(id).style.display = 'none'; }

    // --- LANCEMENT AU DÉMARRAGE ---
    checkUserSession();
    loadMovies();
  </script>
</body>
</html>
